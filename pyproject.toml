[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aclautoguard"
version = "0.1.0"
description = "University project for ACL analysis and network change validation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
aclautoguard = "aclautoguard.cli:main"

[tool.setuptools]
packages = ["aclautoguard"]
